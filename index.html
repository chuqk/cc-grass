<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>cc-grass</title>
<style>
  html, body { margin: 0; padding: 0; }
  body {
    background: #0d1117;
    color: #c9d1d9;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    box-sizing: border-box;
  }
  .cc-section { max-width: 100%; }
  .cc-section-title { font-size: 14px; color: #c9d1d9; margin-bottom: 8px; }
  .cc-frame {
    border: 1px solid #30363d;
    border-radius: 6px;
    background: #0d1117;
  }
  @media (max-width: 800px) {
    .cc-frame { overflow: hidden; }
    .cc-scroll {
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .cc-scroll::-webkit-scrollbar { display: none; }
  }
  .cc-scroll svg rect[data-date]:hover {
    stroke: #ffffff;
    stroke-width: 1;
    cursor: default;
  }
  #cc-grass-scroll > svg > text:first-of-type { display: none; }
  #cc-grass-scroll > svg > rect:first-child,
  #cc-grass-scroll > svg > rect:nth-child(2) { display: none; }
  #cc-grass-scroll > svg { margin-top: -40px; }
  .cc-scroll svg rect[data-week] { cursor: default; }
  .cc-scroll svg rect[data-week]:hover { opacity: 0.85; }
  .cc-legend {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 10px 16px;
    border-top: 1px solid #21262d;
    font-size: 11px;
    color: #7d8590;
  }
  .cc-legend-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px 14px;
  }
  .cc-legend span {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .cc-legend i {
    width: 10px; height: 10px;
    border-radius: 2px;
    flex-shrink: 0;
    display: inline-block;
    font-style: normal;
  }
</style>
</head>

  var tgt=e.target;

    var wi=+tgt.getAttribute('data-week');
    var hm=tgt.getAttribute('data-model');
    var w=weeks[wi];if(!w)return;
    var total=0;Object.keys(w.models).forEach(function(m){total+=w.models[m];});
    var totalCost=0,unpriced=0;
    Object.keys(w.costs).forEach(function(m){if(w.costs[m]===null)unpriced++;else totalCost+=w.costs[m];});
    var costStr=totalCost>0?' \u2248 $'+totalCost.toFixed(2)+(unpriced?'+':''):'';
    var lines=[w.week+' \u2014 '+fmt(total)+' tokens'+costStr];
    models.forEach(function(m){
      if(!w.models[m])return;
      var pct=Math.round(w.models[m]/total*100);
      var mc=w.costs[m];
      var mcStr=mc===null?' (price n/a)':(mc>0?' $'+mc.toFixed(2):'');
      var pre=m===hm?'\u25b8 ':'  ';
      lines.push(pre+m+': '+fmt(w.models[m])+' ('+pct+'%)'+mcStr);
    });
    tip.textContent=lines.join('\n');
    tip.style.display='block';
    var tx=e.clientX+14;
    var ty=e.clientY-10;
    if(tx+tip.offsetWidth>window.innerWidth-8)tx=e.clientX-tip.offsetWidth-14;
    if(ty+tip.offsetHeight>window.innerHeight-8)ty=e.clientY-tip.offsetHeight-10;
    tip.style.left=tx+'px';tip.style.top=ty+'px';
  }
});
svg.addEventListener('mouseleave',function(){tip.style.display='none';});
var ctr=document.getElementById('cc-chart');
var section=document.createElement('div');
section.className='cc-section';
var titleDiv=document.createElement('div');
titleDiv.className='cc-section-title';
titleDiv.textContent='Token usage by model';
section.appendChild(titleDiv);
var frame=document.createElement('div');
frame.className='cc-frame';
var scroll=document.createElement('div');
scroll.className='cc-scroll';
scroll.appendChild(svg);
frame.appendChild(scroll);
var leg=document.createElement('div');
leg.className='cc-legend';
var rows={};
models.forEach(function(m){
  var f=mfam(m);
  var row=rows[f];
  if(!row){row=rows[f]=document.createElement('div');row.className='cc-legend-row';leg.appendChild(row);}
  var span=document.createElement('span');
  var dot=document.createElement('i');
  dot.style.background=gc(m);
  span.appendChild(dot);
  span.appendChild(document.createTextNode(m+' ('+fmt(totals[m])+')'));
  row.appendChild(span);
});
frame.appendChild(leg);
section.appendChild(frame);
ctr.appendChild(section);
if(window.innerWidth>800)frame.style.width=svgW+'px';
scroll.scrollLeft=scroll.scrollWidth;
})();
</script>
<script>
(function(){
  var svg=document.querySelector('#cc-grass-scroll svg');
  if(!svg)return;
  var t=svg.querySelector('text');
  if(t)document.getElementById('cc-grass-title').textContent=t.textContent;
  var gf=document.querySelector('#cc-grass-section .cc-frame');
  if(gf&&window.innerWidth>800)gf.style.width=svg.getAttribute('width')+'px';
  document.querySelectorAll('.cc-scroll').forEach(function(el){
    el.scrollLeft=el.scrollWidth;
  });
})();
</script>
